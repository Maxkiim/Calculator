<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <section id="body">
        <section id="container">
            <span></span>
            <button class="operator"id="remainder">%</button>
            <button class="operator"id="divide">/</button>
            <button class="operator"id="multiply">*</button>
            <button class="operator" id="backspace">⌫</button>
            <button class="number dh"id="seven">7</button>
            <button class="number dh"id="eight">8</button>
            <button class="number dh"id="nine">9</button>
            <button class="reset dh"id="reset">AC</button>
            <button class="number dh"id="four">4</button>
            <button class="number dh"id="five">5</button>
            <button class="number dh"id="six">6</button>
            <button class="operator dh"id="plus">+</button> <!-- SUM BUTTON NOW! -->
            <button class="number dh"id="one">1</button>
            <button class="number dh"id="two">2</button>
            <button class="number dh"id="three">3</button>
            <button class="operator dh"id="substract">-</button>
            <button class="number"id="zero">0</button>
            <button class="number"id="dot">.</button>
            <button class="operator"id="equal">=</button>
        </section>
    </section>
</body>
<script src="script.js"></script>
</html>
